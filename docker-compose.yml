services:
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_VERSION: ${OPENCLAW_VERSION:-latest}
    image: my-openclaw-env:latest
    container_name: openclaw-env
    hostname: openclaw
    user: root
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-openclaw}
      - OPENCLAW_HOME=/home/jovyan/.openclaw
      - GRANT_SUDO=yes
      - CHOWN_HOME=yes
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-}
      - DISCORD_CHANNEL_IDS=${DISCORD_CHANNEL_IDS:-}
      - DISCORD_REQUIRE_MENTION=${DISCORD_REQUIRE_MENTION:-false}
    ports:
      - "8888:8888"
      - "18789:18789"
    volumes:
      - ./work:/home/jovyan/work
      - openclaw-state:/home/jovyan/.openclaw
    working_dir: /home/jovyan/work
    stdin_open: true
    tty: true
    restart: unless-stopped
    command:
      - start-notebook.sh
      - --NotebookApp.token=${JUPYTER_TOKEN:-openclaw}
      - --NotebookApp.ip=0.0.0.0

volumes:
  openclaw-state:
